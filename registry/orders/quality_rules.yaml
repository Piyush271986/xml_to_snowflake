dataset: orders
version: 0.1.0
primary_keys:
- order_id
- line_item_product_code
not_null_columns:
- currency_code
- order_id
- customer_id
- order_date
- order_timestamp
- is_expedited
- total_amount
- line_item_product_code
- line_item_quantity
- line_item_unit_price
accepted_values:
  currency_code:
  - CAD
  - EUR
  - GBP
  - USD
numeric_ranges:
- column: total_amount
  min_value: 0.0
  max_value: null
- column: discount_amount
  min_value: 0.0
  max_value: null
- column: line_item_quantity
  min_value: 0.0
  max_value: null
- column: line_item_unit_price
  min_value: 0.0
  max_value: null
freshness_sla_hours: 24
