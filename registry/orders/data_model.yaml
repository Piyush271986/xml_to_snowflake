dataset: orders
version: 0.1.0
modeling_strategy: Medallion 3-Layer (RAW Normal Table -> STAGE Dynamic Table -> GOLD
  Dynamic Table)
root_element: /Order
business_keys:
- order_id
- line_item_id
raw_layer_file: raw_schema.yaml
staging_layer_file: staging_schema.yaml
gold_layer_file: gold_schema.yaml
entities:
- table_name: raw_orders
  entity: null
  parent_table: null
  foreign_keys: []
  layer: RAW
  table_type: NORMAL_TABLE
  ingestion_or_refresh: SNOWPIPE
  upstream_source: '@RAW.ADLS_XML_STAGE/orders/'
  target_lag: null
  warehouse: COMPUTE_WH
  grain: One row per ingested XML file from ADLS
  primary_keys:
  - _file_name
  - _file_sha256
  flatten_path: null
  columns:
  - name: _file_name
    snowflake_type: VARCHAR(512)
    nullable: false
    source_xpath: null
    expression: null
    description: Source XML filename in ADLS landing zone
    is_business_key: true
    semantic_entity: null
    pii_category: null
    suggested_name: null
  - name: _file_sha256
    snowflake_type: VARCHAR(64)
    nullable: false
    source_xpath: null
    expression: null
    description: SHA-256 content hash for idempotent ingestion
    is_business_key: true
    semantic_entity: null
    pii_category: null
    suggested_name: null
  - name: _source_system
    snowflake_type: VARCHAR(128)
    nullable: false
    source_xpath: null
    expression: null
    description: Source ERP / upstream system identifier
    is_business_key: false
    semantic_entity: null
    pii_category: null
    suggested_name: null
  - name: _load_ts
    snowflake_type: TIMESTAMP_NTZ
