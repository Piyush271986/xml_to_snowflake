er_diagram_staging: "erDiagram\n    staging_orders {\n        VARCHAR order_pk PK\n\
  \        VARCHAR order_type\n        NUMBER version\n        VARCHAR currency_code\n\
  \        VARCHAR channel\n        VARCHAR region\n        NUMBER order_id\n    \
  \    VARCHAR external_purchase_order_number\n        DATE order_date\n        TIMESTAMP_NTZ\
  \ order_timestamp\n        VARCHAR order_status\n        BOOLEAN is_expedited\n\
  \        BOOLEAN is_backorder_allowed\n        NUMBER priority_score\n        NUMBER\
  \ total_amount\n        VARCHAR _more_columns \"+101 more\"\n    }\n    staging_orders_audit_event\
  \ {\n        VARCHAR audit_event_pk PK\n        VARCHAR order_fk FK\n        NUMBER\
  \ sequence\n        VARCHAR event_id\n        VARCHAR event_type\n        TIMESTAMP_NTZ\
  \ event_timestamp\n        VARCHAR actor_id\n        VARCHAR event_notes\n    }\n\
  \    staging_orders_line {\n        VARCHAR line_pk PK\n        VARCHAR order_fk\
  \ FK\n        NUMBER line_number\n        VARCHAR item_category\n        BOOLEAN\
  \ hazmat\n        VARCHAR id\n        VARCHAR product_code\n        VARCHAR manufacturer_part_number\n\
  \        VARCHAR product_name\n        VARCHAR product_family\n        VARCHAR unit_of_measure\n\
  \        NUMBER quantity\n        NUMBER unit_price\n        NUMBER line_discount_amount\n\
  \        NUMBER line_tax_rate\n        NUMBER line_tax_amount\n        VARCHAR _more_columns\
  \ \"+16 more\"\n    }\n    staging_orders_installment {\n        VARCHAR installment_pk\
  \ PK\n        VARCHAR order_fk FK\n        NUMBER installment_number\n        VARCHAR\
  \ id\n        DATE due_date\n        NUMBER percentage\n        NUMBER amount\n\
