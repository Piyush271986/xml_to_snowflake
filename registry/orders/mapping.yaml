dataset: orders
version: 0.1.0
source: sample_inference
root_element: /Order
business_keys:
- order_id
- line_item_product_code
targets:
  raw_table: raw_orders
  staging_table: staging_orders
  curated_table: curated_orders
  quarantine_table: quarantine_orders
  dq_results_table: dq_results_orders
fields:
- xpath: /Order/@currency
  column: currency_code
  snowflake_type: VARCHAR
  xml_expr: raw_xml:"@currency"::VARCHAR
  required: true
  is_array: false
  flatten_path: null
  is_attribute: true
  confidence: 1.0
  sample_values:
  - USD
  - EUR
  - GBP
  - CAD
  origin: c0_bootstrap
  added_in_version: 0.1.0
- xpath: /Order/OrderId
  column: order_id
